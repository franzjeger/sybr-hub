<!DOCTYPE html>
<!-- Written in Norwegian, the interface's default. offline.js puts it in the
     signed-in person's language (ui_lang) and sets lang to match; this page
     never loads theme-init.js or ui_i18n.json, since the hub may not answer. -->
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4d9fb5">
<title>Frakoblet: Sybr HUB</title>
<link rel="stylesheet" href="/static/offline.css">
<script type="module" src="/static/offline.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="card" role="alert">
      <div class="icon" aria-hidden="true"></div>
      <h1 id="offline-title">Du er offline</h1>
      <p id="offline-text">
        Sybr HUB krever kontakt med serveren for å vise live data. Siden vil prøve
        å laste på nytt når nettverket er tilbake.
      </p>
      <button class="retry" id="offline-retry" type="button">Prøv igjen</button>
      <div class="hint"><span class="dot"></span><span id="status">Venter på forbindelse…</span></div>
    </div>
  </div>
</body>
</html>
