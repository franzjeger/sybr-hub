<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4d9fb5">
<title>Offline — MSP Toolkit</title>
<link rel="stylesheet" href="/static/offline.css">
</head>
<body>
  <div class="wrap">
    <div class="card" role="alert">
      <div class="icon" aria-hidden="true">📡</div>
      <h1>Du er offline</h1>
      <p>
        MSP Toolkit krever kontakt med serveren for å vise live data. Siden vil prøve
        å laste på nytt når nettverket er tilbake.
      </p>
      <button class="retry" id="offline-retry" type="button">Prøv igjen</button>
      <div class="hint"><span class="dot"></span><span id="status">Venter på forbindelse…</span></div>
    </div>
  </div>
<script src="/static/offline.js"></script>
</body>
</html>
