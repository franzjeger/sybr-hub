<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4d9fb5">
<title>Offline — MSP Toolkit</title>
<style>
  :root {
    color-scheme: dark light;
    --bg: #0d1117;
    --bg-card: #161b22;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --blue: #4d9fb5;
    --border: #30363d;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f8fa; --bg-card: #ffffff; --text: #1a3148; --text-muted: #57606a; --blue: #1d6387; --border: #d0d7de; }
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    box-sizing: border-box;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.15);
  }
  .icon {
    font-size: 56px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 8px;
    color: var(--blue);
  }
  p {
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.6;
    margin: 0 0 24px;
  }
  .retry {
    display: inline-block;
    background: var(--blue);
    color: #fff;
    border: none;
    padding: 10px 22px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    min-height: 44px;
    line-height: 1.6;
  }
  .retry:hover { filter: brightness(1.1); }
  .hint {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 20px;
  }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #f85149;
    margin-right: 4px;
    vertical-align: middle;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="alert">
      <div class="icon" aria-hidden="true">📡</div>
      <h1>Du er offline</h1>
      <p>
        MSP Toolkit krever kontakt med serveren for å vise live data. Siden vil prøve
        å laste på nytt når nettverket er tilbake.
      </p>
      <button class="retry" onclick="location.reload()">Prøv igjen</button>
      <div class="hint"><span class="dot"></span><span id="status">Venter på forbindelse…</span></div>
    </div>
  </div>
<script>
  // Auto-retry when the browser reports connectivity restored
  window.addEventListener('online', function() { location.reload(); });
  // Periodic ping so the page self-heals even if 'online' event is missed
  setInterval(function() {
    fetch('/api/health', { cache: 'no-store' })
      .then(function(r) { if (r.ok) location.reload(); })
      .catch(function() {});
  }, 15000);
  // Update the status dot with navigator.onLine
  function paint() {
    var ok = navigator.onLine;
    document.getElementById('status').textContent = ok ? 'Nettverk tilbake — verifiserer server…' : 'Venter på forbindelse…';
  }
  paint();
  window.addEventListener('online', paint);
  window.addEventListener('offline', paint);
</script>
</body>
</html>
