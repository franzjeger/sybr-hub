[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sybr-hub"
dynamic = ["version"]
description = "Read-mostly aggregator for MSP technicians — M365 audit + Autotask + IT Glue + myITprocess + RMM in one place."
license = "MIT"
requires-python = ">=3.11"
# Kept in sync with requirements.txt, which stays the canonical list for
# `pip install -r`. Anything imported by app/ belongs here too, otherwise
# `pip install .` produces a package that cannot start.
dependencies = [
    "fastapi>=0.111.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "python-multipart>=0.0.7,<1.0",
    "websockets>=12.0,<15.0",
    "textual>=0.60.0,<2.0",
    "httpx>=0.27.0,<1.0",
    "msal>=1.28.0,<2.0",
    "azure-identity>=1.16.0,<2.0",
    "azure-mgmt-compute>=30.3.0,<32.0",
    "azure-mgmt-network>=25.3.0,<27.0",
    "azure-mgmt-resource>=23.1.0,<24.0",
    "azure-mgmt-storage>=21.1.0,<26.0",
    "azure-mgmt-monitor>=6.0.1,<7.0",
    "azure-mgmt-advisor>=9.0.0,<10.0",
    "azure-mgmt-recoveryservices>=2.5.0,<3.0",
    "azure-mgmt-recoveryservicesbackup>=8.0.0,<10.0",
    "azure-mgmt-loganalytics>=13.0.0,<14.0",
    "azure-mgmt-desktopvirtualization>=1.0.0,<2.0",
    "azure-mgmt-costmanagement>=4.0.0,<5.0",
    "azure-mgmt-authorization>=4.0.0,<5.0",
    "azure-mgmt-resource-subscriptions>=1.0.0b1,<2.0",
    "keyring>=24.3.0,<26.0",
    "cryptography>=50.0.0,<51.0",
    "jinja2>=3.1.4,<4.0",
    "weasyprint>=69.0,<70.0",
    "nh3>=0.3.6,<0.4",
    "asyncssh>=2.14.0,<3.0",
    "aiosqlite>=0.20.0,<1.0",
    "argon2-cffi>=25.1.0,<26.0",
    "PyJWT[crypto]>=2.9.0,<3.0",
    "dnspython>=2.6.0,<3.0",
    "pyOpenSSL>=26.4.0,<27.0",
    "pychrome>=0.2.4,<1.0",
    "anthropic>=0.40.0,<1.0",
    "platformdirs>=4.2.0,<5.0",
    "pydantic>=2.7.0,<3.0",
    "six>=1.16.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10.0",
    "pytest-asyncio>=1.4.0,<2.0",
    "ruff",
]

[project.scripts]
sybr-hub = "main:run"

[tool.setuptools]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "app.core.version.__version__"}

[tool.setuptools.package-data]
app = [
    "baselines/*.json",
    "helpers/*.ps1",
    "policy_templates/*.json",
    "reports/templates/*",
    "web/static/*",
    "web/static/icons/*",
    "web/static/vendor/*",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Collect only from tests/. Without this pytest walks the whole checkout, and
# anything unreadable in it becomes a collection error rather than a test
# failure — a stray symlink under Logo-Branding pointing outside the repo took
# the installer's test gate down that way, on a tree where every test passed.
testpaths = ["tests"]
markers = [
    # PDF rendering costs ~9s — the only test that catches WeasyPrint failing
    # on a missing system library, which is a deployment failure rather than a
    # code one. CI runs everything; `pytest -m "not slow"` skips it locally.
    "slow: takes seconds rather than milliseconds",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".venv",
    "venv",
    "build",
    "dist",
    "app/web/static",
    "app/reports/templates",
]

[tool.ruff.lint]
# A pragmatic "on by default" set:
#   E  pycodestyle errors    F  pyflakes
#   I  isort                 UP pyupgrade
#   B  bugbear               SIM simplify
#   RUF Ruff-specific lints
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Allow longer lines in generated strings / SQL DDL where wrapping hurts
# more than it helps.
ignore = [
    "E501",   # line-length handled by formatter, not linter
    "B008",   # function-call in default arg — FastAPI Depends() is idiomatic
    "SIM108", # ternary-vs-if preference; we keep readability on a case-by-case basis
    "UP007",  # Optional[X] vs X | None — keep for codebase consistency
]

[tool.ruff.lint.per-file-ignores]
# Tests can be verbose; don't hector about unused args / shadowing fixtures.
"tests/**.py" = ["F401", "F811", "B011"]
# Scripts are entry points, not library code.
"scripts/**.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
