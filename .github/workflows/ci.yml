name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref so a new push to a PR doesn't
# leave the previous run hanging (a stuck runner can otherwise sit in
# 'in_progress' for hours, as happened with run 25760604034). Pushes to
# main never cancel each other — `github.run_id` keeps each one unique.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system deps for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v --tb=short

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff format check
        run: ruff format --check .
        continue-on-error: true
      # Non-blocking for now — baseline has existing lint debt we don't want to
      # paper over in a lockstep reformat. Remove continue-on-error when the
      # debt is worked down.
      - name: Ruff lint
        run: ruff check .
        continue-on-error: true

  security:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      # Non-blocking: known CVEs are reported but do not fail the build.
      # Flip `continue-on-error` to false once baseline is clean.
      - name: Scan dependencies for known CVEs
        continue-on-error: true
        run: pip-audit -r requirements.txt --disable-pip --strict
